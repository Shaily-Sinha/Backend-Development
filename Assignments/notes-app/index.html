<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notes App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header class="header">

            <h1>My Notes</h1>

            <button id="themeBtn">🌙 Dark Mode</button>

        </header>


        <!-- Add Note Section -->
        <div class="note-form">

            <textarea
                id="noteInput"
                placeholder="Write your note here..."
                rows="4">
            </textarea>

            <!-- Category -->
            <input
                type="text"
                id="categoryInput"
                placeholder="Category (e.g. Study, Work, Personal)"
            >

            <!-- Add Button -->
            <button id="addNoteBtn">
                Add Note
            </button>

        </div>


        <!-- Search and Filter -->
        <div class="controls">

            <input
                type="text"
                id="searchInput"
                placeholder="Search notes..."
            >

            <select id="filterSelect">

                <option value="all">All Notes</option>

                <option value="active">
                    Active
                </option>

                <option value="completed">
                    Completed
                </option>

            </select>

        </div>


        <!-- Import / Export -->
        <div class="file-controls">

            <button id="exportBtn">
                Export JSON
            </button>

            <button id="importBtn">
                Import JSON
            </button>

            <!-- Hidden file input -->
            <input
                type="file"
                id="importInput"
                accept=".json"
                hidden
            >

        </div>


        <!-- Notes -->
        <div id="notesContainer">

            <!-- JavaScript will generate notes here -->

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
